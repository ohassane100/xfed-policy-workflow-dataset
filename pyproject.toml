[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "xfed"
version = "0.1.0"
description = "Contract-to-policy pipeline scaffolding for XFed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
legacy-pdf = ["pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xfed", "xfed.*"]
