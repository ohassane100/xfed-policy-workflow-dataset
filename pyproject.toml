[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "xfed"
version = "0.1.0"
description = "XFed contract preprocessing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2", "jsonschema>=4.18,<5", "PyYAML>=6,<7"]

[tool.setuptools]
packages = ["xfed", "xfed.extraction", "xfed.segmentation", "xfed.relevance", "xfed.enrichment", "xfed.llm", "xfed.common"]

[tool.setuptools.package-dir]
xfed = "src"
"xfed.extraction" = "src/1 preprocessing/1.1 extraction"
"xfed.segmentation" = "src/1 preprocessing/1.2 segmentation"
"xfed.relevance" = "src/1 preprocessing/1.3 relevance"
"xfed.enrichment" = "src/1 preprocessing/1.4 enrichment"
