r Agreement (MDTA)\n\nThis template aims to provide suggested language for Human Cell Atlas (HCA) community, to assist participating institutions in drafting and finalizing their own Material/Data Transfer Agreement in line with the specificities of the HCA project. Use of this template is not compulsory and it is not intended to provide legal guidance or advice. It was developed as a tool by the Ethics Working Group of the HCA to serve as examples of language that institutions can use in their own agreements. \n\nWhy a material and data transfer agreement template?\nDifferent data contribution scenarios may arise in the HCA. In particular, there may be cases where the research group/institution collecting tissue samples may need to transfer these tissues to another research group/institution in order to undertake molecular analysis (including sequencing). \nIn such cases, to enable downstream contribution of data to the HCA, the collaborating institutions would need to ensure that their bilateral Material/Data Transfer Agreement do not contain any provisions that may limit contribution of data to the HCA project. \nThis template provides examples of contractual clauses that can be adapted to such situations. \n\nWhat are some examples of limitations that could impact ability to contribute data to the HCA and that should not be included in bilateral Material/Data Transfer Agreements?\nRestrictions on use of Research Materials. Providing Institutes should carefully assess and disclose any restrictions on the use of the Research Materials (e.g. in consent materials), as this may have an impact on whether derived Research Data can be deposited in a fully open (public) access database, or a managed access database (see Section 3). Alternatively, if the Providing Institute can demonstrate appropriate consents or permissions, clauses for fully open (public) sharing can be used (see Section 3.3).   \t\nIntellectual property. Drafters of Material/Data Transfer Agreements should be particularly vigilant of any provisions related to ownership of Research Data, or of any licensing provisions that may restrict the ability of one of the Parties to contribute data to the HCA through restrictions on downstream use by HCA users. (See Section 9). \n\nSections and clauses specific to the HCA Project are the following: \n\n\u0010\u0012\u001cSection\n\u001cDescription\n\u0012\u001cDefinitions\n\u001cThe following additional definitions are provided to facilitate contribution to the HCA: \n“HCA Project”\n“Research Data”\n\u0012\u001cSection 1\n(Purpose(s) of Use)\n\u001cIncludes a suggested statement for future contribution of data derived from the Research Materials to the HCA\n\u0012\u001cSection 6 (Contribution of Research Data to the HCA)\n\u001cIncludes information on the process for submitting Research Data to the HCA as well as a requirement to comply with the HCA’s Data Release Policy. \n\u0012\u001cSection 8 (Confidentiality)\n\u001cExempts Research Data contributed to the HCA from mutual confidentiality obligations. \n\u0012\u001cAppendix A\n\u001cIt is suggested that the Purpose of Use relating to contribution to the HCA be replicated in the Description of the Research Project in Appendix A. \nConsider including a description or list of Research Data to be contributed to the HCA in this appendix. \n\u0011\n\n\f\nTemplate: Material \u0026 Data Transfer Agreement\n\nUse of this template is not compulsory and it is not intended to provide legal guidance or advice. It was developed as a tool by the Ethics Working Group of the HCA to serve as examples of language that institutions can use in their own agreements. \n\nThis agreement governs the transfer of Materials between the Providing Institute and the Receiving Institute for the purpose of generating Research Data from the Materials. \n\nThis Agreement is made and entered into on________(the “Effective Date”) by and between: \n\nProviding Institute\nThe Providing Institute, [insert name of legal entity that is authorized to enter in this agreement], a [include type of legal entity, e.g. academic institution, foundation, charity, corporation, etc.], incorporated and duly constituted under the laws of [insert jurisdiction], with its principal office at [insert address]. \n"},{"ty":"as","st":"document","si":0,"ei":0,"sm":{"ds_pw":595.45,"ds_lhs":1,"ds_rtd":"mso-rtd.0","ds_fi":"kix.hf2","ds_ulhfl":false,"ds_hi":"kix.hf0","ds_epfi":"kix.hf1","ds_ph":841.7}},{"ty":"ae","et":"list","id":"kix.list.10","epm":{"le_nb":{"nl_4":{"b_gf":"%4","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_it_i":true,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_st":false,"ts_fgc2_i":true,"ts_bd":false,"ts_sc_i":true,"ts_tw":400},"b_ifl":162.0,"b_gs":"○","b_a":0,"b_sn":1,"b_gt":9,"b_il":180.0},"nl_3":{"b_gf":"%3","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_it_i":true,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_st":false,"ts_fgc2_i":true,"ts_bd":false,"ts_sc_i":true,"ts_tw":400},"b_ifl":126.0,"b_gs":"●","b_a":0,"b_sn":1,"b_gt":9,"b_il":144.0},"nl_2":{"b_gf":"%2","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"ts_it_i":true,"ts_fgc2":{"hclr_color":"#000000","clr_type":0},"ts_st_i":true,"ts_bgc2":{"hclr_color":null,"clr_type":0},"ts_fs_i":true,"ts_ff_i":true,"ts_bgc2_i":true,"ts_it":false,"ts_va":"nor","ts_bd_i":true,"ts_va_i":true,"ts_fs":11.0,"ts_ff":"Arial","ts_st":false,"ts_fgc2_i":true,"ts_bd":false,"ts_sc_i":true,"ts_tw":400},"b_ifl":90.0,"b_gs":"■","b_a":0,"b_sn":1,"b_gt":9,"b_il":108.0},"nl_1":{"b_gf":"%1","b_ts":{"ts_un":false,"ts_un_i":false,"ts_sc":false,"t
