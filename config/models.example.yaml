# Copy to config/models.yaml and fill in the endpoint/model available to you.
relevance_classifier:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3.1:70b
  timeout: 300
  num_ctx: 16384
  num_predict: 4096
  relevance_num_predict: 4096
  relevance_batch_size: 1
  relevance_compact: false
  relevance_num_ctx: 0  # Use the run's context allocation; preserve all supporting evidence.
  # Optional relevance_num_batch: 1024 controls prompt-processing tokens, not clause count.
  keep_alive: 30m
  relevance_think: auto  # Disable thinking for classification only when supported.
  # Omit think to preserve the policy model's default; some models cannot disable thinking.
