# Copy to config/models.yaml and fill in the endpoint/model available to you.
relevance_classifier:
  provider: ollama
  base_url: http://localhost:11434
  model: llama3.1:70b
  timeout: 900
  num_ctx: 32768
  num_predict: 12288
  think: auto  # Prefer supported policy reasoning; classification stays separate.
  relevance_num_predict: 4096
  relevance_batch_size: 1
  relevance_compact: false
  relevance_num_ctx: 0  # Use the run's context allocation; preserve all supporting evidence.
  # Optional relevance_num_batch: 1024 controls prompt-processing tokens, not clause count.
  keep_alive: 30m
  relevance_think: auto  # Disable thinking for classification only when supported.
  # Set think: null to use the policy model's default, or true to request thinking.

# Same-model parallel CLI runs on Gorina5. The UI offers these choices per run.
# Remove execution to use the existing shared service with one request at a time.
execution:
  workers: 2
  worker_gpus: null  # Auto; use [0, 1] for a separate copy on each GPU.
  service:
    binary: /local/ollama/bin/ollama
    user: ollama
    # models_dir: /absolute/path/to/existing/model/store
    # Defaults to OLLAMA_MODELS from the system service, then the user's default store.
